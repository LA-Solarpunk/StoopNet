; StoopNet ESP32 test device — an M5StickC / M5StickC Plus that exercises a
; StoopNet node (heltec_v4_*_stoop_radio in the parent repo) over WiFi.
;
; Build/upload/monitor via ./scripts/run.sh; the two-device loop (flash both,
; reboot, join the node's AP, run the HTTP suite) is scripts/test_flow.sh:
;   ./scripts/run.sh flow

[platformio]
default_envs = m5stick-tester

[env:m5stick-tester]
platform = espressif32
framework = arduino
board = m5stick-c           ; ESP32-PICO-D4 — fits both M5StickC and M5StickC Plus
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<tester/*>
build_flags =
    -D TESTER_LED_GPIO=10           ; red LED on both StickC revisions, active low
    -D STOOP_TEST_SSID='"Neighborhood Board (free)"'
    -D STOOP_TEST_HOST='"8.8.8.8"'  ; the node softAP-configures itself to 8.8.8.8
    ; override per build to tag firmware: test_flow.sh passes -D TESTER_BUILD_LABEL
    -D TESTER_BUILD_LABEL='"local"'
