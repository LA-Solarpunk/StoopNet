<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoop Alerts</title>
<style>
  :root{
    --bg: #fbf3e7;
    --card: #ffffff;
    --ink: #2b2320;
    --muted: #6b5f56;
    --amber: #d98c2b;
    --amber-dark: #b8701c;
    --line: #ecdfc9;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    padding: 24px 16px 60px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  .back{
    display:inline-block;
    color: var(--muted);
    text-decoration:none;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  h1{ font-size: 1.7rem; margin: 0 0 4px; }
  .tagline{ color: var(--muted); margin: 0 0 24px; }
  .alert-list{ list-style: none; margin: 0; padding: 0; }
  .alert{
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--amber);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(60, 40, 10, 0.05);
  }
  .alert .body{ white-space: pre-wrap; word-wrap: break-word; }
  .alert time{
    display: block;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 8px;
  }
  .empty{ color: var(--muted); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Alerts</h1>
  <p class="tagline">Notices from this node's admin, newest first.</p>

  <ul class="alert-list" id="alertList"><li class="empty">Loading&hellip;</li></ul>
</div>

<script>
  const alertListEl = document.getElementById('alertList');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  }

  function render(alerts) {
    if (!alerts.length) {
      alertListEl.innerHTML = '<li class="empty">No alerts posted yet.</li>';
      return;
    }
    alertListEl.innerHTML = alerts.map(a => {
      const when = new Date(a.posted * 1000).toLocaleString();
      return `<li class="alert"><div class="body">${escapeHtml(a.body)}</div><time>${when}</time></li>`;
    }).join('');
  }

  async function load() {
    try {
      const res = await fetch('/api/alerts');
      if (res.ok) {
        render(await res.json());
      } else {
        alertListEl.innerHTML = '<li class="empty">Could not load alerts.</li>';
      }
    } catch (e) {
      alertListEl.innerHTML = '<li class="empty">Could not load alerts.</li>';
    }
  }
  load();
</script>
</body>
</html>
