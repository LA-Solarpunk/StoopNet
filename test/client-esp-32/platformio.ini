; StoopNet ESP32 test clients — small boards that exercise StoopNet nodes
; (heltec_v4_*_stoop_radio in the parent repo) over WiFi:
;   m5stick-tester  M5StickC / M5StickC Plus
;   s3-tester       ESP32-S3 dev kit on native USB (the rig's "standard ESP32")
;   esp32-tester    classic ESP32 (WROOM) dev kit
;
; Build/upload/monitor via ./scripts/run.sh; the two-device loop (flash both,
; reboot, join the node's AP, run the HTTP suite) is scripts/test_flow.sh:
;   ./scripts/run.sh flow
; The two-node mesh relay test is scripts/mesh_flow.sh:
;   ./scripts/run.sh mesh-flow

[platformio]
default_envs = m5stick-tester

[env:m5stick-tester]
platform = espressif32
framework = arduino
board = m5stick-c           ; ESP32-PICO-D4 — fits both M5StickC and M5StickC Plus
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<tester/*>
build_flags =
    -D TESTER_LED_GPIO=10           ; red LED on both StickC revisions, active low
    -D STOOP_TEST_SSID='"Neighborhood Board (free)"'
    -D STOOP_TEST_HOST='"8.8.8.8"'  ; the node softAP-configures itself to 8.8.8.8
    ; override per build to tag firmware: the flash scripts pass -D TESTER_BUILD_LABEL
    -D TESTER_BUILD_LABEL='"local"'

; plain dev-kit boards. The rig's "standard ESP32" is an ESP32-S3 devkit whose
; Serial lives on the native USB JTAG/serial unit — CDC-on-boot must be on or
; the logs never reach the host; most such kits have no plain LED, so the
; blink patterns are off.
[env:s3-tester]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<tester/*>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1    ; Serial == native USB (JTAG/serial unit)
    -D TESTER_LED_GPIO=-1           ; no plain LED on these kits
    -D STOOP_TEST_SSID='"Neighborhood Board (free)"'
    -D STOOP_TEST_HOST='"8.8.8.8"'
    -D TESTER_BUILD_LABEL='"local"'

; classic ESP32 (WROOM) dev kits behind a USB-serial bridge; the onboard LED
; is GPIO 2, wired active high
[env:esp32-tester]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<tester/*>
build_flags =
    -D TESTER_LED_GPIO=2
    -D TESTER_LED_ACTIVE_HIGH
    -D STOOP_TEST_SSID='"Neighborhood Board (free)"'
    -D STOOP_TEST_HOST='"8.8.8.8"'
    -D TESTER_BUILD_LABEL='"local"'
