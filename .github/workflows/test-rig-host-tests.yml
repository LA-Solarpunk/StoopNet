name: Test Rig Host Tests

# The ESP32 test rig (test/client-esp-32) ships a stdlib-only Python unit test
# suite for its host-side scripts: the SELFTEST verdict parser, USB device
# classification, the serial console CLI, the log analyzer, and the
# platformio.ini invariants that keep the clients join-compatible with the node
# firmware. Those checks run in a second, and they need no hardware.
#
# The on-device suites (run.sh flow / mesh-flow) are NOT covered here -- they
# need the physical rig. See test/client-esp-32/README.md.

on:
  push:
    branches: [main, dev]
    paths:
      - 'test/client-esp-32/**'
      - '.github/workflows/test-rig-host-tests.yml'
  pull_request:
    paths:
      - 'test/client-esp-32/**'
      - '.github/workflows/test-rig-host-tests.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/client-esp-32
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyserial
        # only serial_cmd/find_ports tests touch it, and only under mock --
        # but the import has to resolve for the suite to load
        run: python -m pip install --quiet pyserial

      - name: Run host test suite
        run: python -m unittest discover -s scripts/tests -v
